#cloud-config
# Template — claude-vm substitutes __VM_USER__ and __SSH_PUBKEY__ before passing this
# to `virt-install --cloud-init`. Intentionally minimal: everything beyond getting SSH
# up belongs in provision.sh, which is re-runnable and doesn't need a rebuild to change.

users:
  - name: __VM_USER__
    groups: [wheel]
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    shell: /bin/bash
    ssh_authorized_keys:
      - __SSH_PUBKEY__

# Key-only. There is no password to guess and no console login to fall back to.
ssh_pwauth: false
disable_root: true

# The root partition is grown to fill VM_DISK_GB; the image ships far smaller.
growpart:
  mode: auto
  devices: ['/']
resize_rootfs: true

write_files:
  - path: /etc/profile.d/agent-vm.sh
    permissions: '0644'
    content: |
      # Marks the guest so provisioning and agents can tell they're inside the VM.
      export AGENT_VM=1

final_message: 'agent-vm guest ready after $UPTIME seconds'
