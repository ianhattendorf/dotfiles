# Defaults for agent-vm. Override per-machine in ~/.config/agent-vm.conf,
# which is sourced after this file.

# libvirt's QEMU driver defaults to qemu:///session for non-root users — being in the
# libvirt group grants socket access but does NOT change the default URI. Pin it so
# nothing here depends on the caller's environment or ~/.config/libvirt/libvirt.conf.
VM_LIBVIRT_URI=qemu:///system

VM_NAME=agent-vm

# Pinned so a rebuild lands on the same address. A DHCP reservation keyed to this MAC gives
# the guest a stable IP, which is what the ~/.ssh/config entry — and therefore kepler's
# remote target list, which parses that file — depends on. Without it every recreate draws a
# new lease and the target goes stale. MACs only need to be unique on this host's virbr0.
VM_MAC=52:54:00:54:25:c8
VM_IP=192.168.122.50

# Sized for several concurrent kepler tasks, each potentially running VS Code or an
# Electron build under Xvfb (host: 54G/16 threads).
VM_MEMORY=16384
VM_VCPUS=8
VM_DISK_GB=60
VM_STATE_GB=8
VM_USER=dev

# Kept under /var/lib/libvirt/images so images inherit the virt_image_t SELinux label;
# a $HOME path would need an explicit `semanage fcontext` rule.
VM_IMAGE_DIR=/var/lib/libvirt/images/agent-vm
VM_SSH_KEY=$HOME/.ssh/agent-vm

# Git identity for every repo in the guest, set --global during provisioning. Left unset
# here on purpose: `agent-vm provision` resolves the host's own identity, so a work box
# seeds the work address and a personal box the personal one, and no personal address is
# committed to this (public) repo. Set these to override that.
# VM_GIT_NAME=
# VM_GIT_EMAIL=

# Emulated TPM 2.0 (swtpm, ships with @virtualization). Provision creates a
# NON-EXPORTABLE TPM-resident git key in it and prints the public half — add that to
# GitHub as a read-only deploy key and the guest can fetch private repos itself.
# The swtpm state is tied to the domain, so a recreate means a new key to register.
VM_TPM=1

# osinfo-db often lags a new Fedora release, so don't hard-code fedora44 — detect, and
# fall back to the generic id rather than failing the whole create.
VM_OSINFO='detect=on,name=fedora-unknown'

FEDORA_RELEASE=44

# The master server, NOT download.fedoraproject.org. The latter is a redirector that hands
# out a different mirror on every single call, so the index, the CHECKSUM, and the image
# could each come from a different mirror mid-respin — and an unresponsive one hangs a
# silent curl forever. dl. is slower but consistent. Override if you have a good local one.
FEDORA_MIRROR=https://dl.fedoraproject.org/pub/fedora/linux/releases

# Public remote — cloning it needs no credentials, which is the point. Private repos are
# seeded from the host instead (`agent-vm seed`); the guest holds no GitHub credentials.
GITLENS_REMOTE=https://github.com/gitkraken/vscode-gitlens.git

# Host checkout that `create` auto-seeds into the guest (private repo, so it can't be
# cloned from inside). Re-seed later with: agent-vm seed "$KEPLER_HOST_REPO"
KEPLER_HOST_REPO=$HOME/dev/repos/kepler
