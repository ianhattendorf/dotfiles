log-file="~/mpv.log"


###########
# General #
###########

# Default profile
# Selected API: select either Vulkan (preferred) or OpenGL
vo=gpu
gpu-api=auto # vulkan once asahi supports it
hwdec=auto # enable best HW decoder; turn off for software decoding
# profile=high-quality
profile=fast

# Additional Vulkan settings
vulkan-async-compute=yes
vulkan-async-transfer=yes
vulkan-queue-count=1
vd-lavc-dr=yes

# reset-on-next-file=audio-delay,mute,pause,speed,sub-delay,video-aspect-override,video-pan-x,video-pan-y,video-rotate,video-zoom,volume
# framedrop=no

screenshot-format=png
screenshot-png-compression=8
screenshot-template='~/Desktop/%F (%P) %n'

stop-screensaver=yes

#########
# Cache #
#########


#############
# Streaming #
#############

ytdl=yes
ytdl-format=bestvideo[height<=?1080]+bestaudio/best

#############
# OSD / OSC #
#############


#############
# Subtitles #
#############

sub-use-margins=yes

demuxer-mkv-subtitle-preroll=yes        # try to correctly show embedded subs when seeking
sub-auto=fuzzy                          # external subs don't have to match the file name exactly to autoload
sub-file-paths=ass:srt:sub:subs:subtitles    # search for external subs in the listed subdirectories
embeddedfonts=yes                       # use embedded fonts for SSA/ASS subs
sub-fix-timing=no                       # do not try to fix gaps (which might make it worse in some cases)
sub-ass-style-overrides=Kerning=yes         # allows you to override style parameters of ASS scripts

# the following options only apply to subtitles without own styling (i.e. not ASS but e.g. SRT)
sub-font="Source Sans Pro Semibold"
sub-font-size=36
sub-color="#FFFFFFFF"
sub-border-color="#FF262626"
sub-border-size=3.2
sub-shadow-offset=1
sub-shadow-color="#33000000"
sub-spacing=0.5


#############
# Languages #
#############

slang=enUS,en,eng,ptBR,pt,por           # automatically select these subtitles (decreasing priority)
alang=enUS,en,eng,ptBR,pt,por           # automatically select these audio tracks (decreasing priority)


#########
# Audio #
#########

audio-file-auto=fuzzy                   # external audio doesn't has to match the file name exactly to autoload
volume=100                              # set volume to 100 and use the sound server to actually control the volume
volume-max=100

# dedicated
# audio-exclusive=yes
# audio-spdif=ac3,eac3,dts,dts-hd,truehd
# audio-channels=7.1,5.1,stereo


############
# Playback #
############

deinterlace=no # global reset of deinterlacing to off


##############
# Colorspace #
##############

target-prim=auto
# target-prim=bt.709 # target Rec.709 for SDR TVs
# target-prim=bt.2020 # target Rec.2020 (wide color gamut) for HDR TVs
target-trc=auto
# target-peak=<nits>
# target-contrast=<contrast, e.g. 1000>
# tone-mapping=spline
# tone-mapping-max-boost=1.0
# tone-mapping-visualize=yes
# gamut-mapping-mode=auto
# vf=format=colorlevels=full:colormatrix=auto
# video-output-levels=full
hdr-compute-peak=yes
target-colorspace-hint=yes


##########
# Dither #
##########

dither-depth=auto
temporal-dither=yes
dither=fruit


#############
# Debanding #
#############

deband=no # enabled in profiles
deband-iterations=4 # deband steps
deband-threshold=35 # deband strength
deband-range=16 # deband range
deband-grain=5 # dynamic grain: set to "0" if using the static grain shader


#########################
# Motion Interpolation  #
#########################

# display-fps-override=60
# NOTE: display-resample doesn't work with bitstreaming audio, display-tempo does
# video-sync=display-tempo
# interpolation=yes
# tscale=oversample # smoothmotion

###########
# Scaling #
###########

dscale=mitchell

# Light scaling
# scale=spline36
# cscale=spline36

# Medium scaling
# scale=lanczos
# cscale=lanczos

# Heavy scaling
scale=ewa_lanczossharp
cscale=ewa_lanczossharp


################
# Anti-Ringing #
################

scale-antiring=0.8
dscale-antiring=0.8
cscale-antiring=0.8


#############################################################
# Upscaling & Processing Based on Source Video's Resolution #
#############################################################

# Chroma subsampling means that chroma information is encoded at lower resolution than luma
# In MPV, chroma is upscaled to luma resolution (video size) and then the converted RGB is upscaled to target resolution (screen size)
# For a detailed analysis of upscaler/downscaler quality, see https://artoriuz.github.io/blog/mpv_upscaling.html
# For overview of MPV's video output, see https://github.com/mpv-player/mpv/wiki/Video-output---shader-stage-diagram


############
# Profiles #
############

# 3 levels based on `scale` option:
# ewa_lanczossharp -> heavy
# lanczos -> medium
# _ -> light

[8bitDeband]
profile-cond=(p["video-params/pixelformat"] == "yuv420p")
deband=yes
profile-restore=copy

[VideoChromaUpscale]
profile-cond=(p["video-params/pixelformat"] == "yuv420p10" or p["video-params/pixelformat"] == "yuv420p")
# CfL looks better than Krig, but both are (cheap) minor improvements
# glsl-shader="~~/shaders/CfL_Prediction.glsl" # chroma upscaling
glsl-shader="~~/shaders/KrigBilateral.glsl" # chroma upscaling
profile-restore=copy

[VideoLumaUpscaleUpToDoubleHeavy]
profile-cond=(p["scale"] == "ewa_lanczossharp" and p["display-width"] > width and p["display-width"] <= 2 * width)
# SSSR looks better than FSRCNNX/ravu
glsl-shader="~~/shaders/SSimSuperRes.glsl" # luma upscaling (fractional) average
profile-restore=copy

[VideoLumaUpscaleMoreThanDoubleHeavy]
profile-cond=(p["scale"] == "ewa_lanczossharp" and p["display-width"] > 2 * width)
# For scaling > 2x, FSRCNNX + SSSR look better than SSSR or FSRCNNX alone
glsl-shader="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl" # luma upscaling (doubler) average
glsl-shader="~~/shaders/SSimSuperRes.glsl" # luma upscaling (fractional) average
profile-restore=copy

[VideoLumaUpscaleMedium]
profile-cond=(p["scale"] == "lanczos" and p["display-width"] > width)
glsl-shader="~~/shaders/SSimSuperRes.glsl" # luma upscaling (fractional) average
profile-restore=copy

[VideoLumaUpscaleDoubleLight]
profile-cond=(p["scale"] ~= "ewa_lanczossharp" and p["scale"] ~= "lanczos" and p["display-width"] == 2 * width)
glsl-shader="~~/shaders/ravu-lite-ar-r4-gather.hook" # luma upscaling (double) light
profile-restore=copy

[VideoLumaUpscaleNotDoubleLight]
profile-cond=(p["scale"] ~= "ewa_lanczossharp" and p["scale"] ~= "lanczos" and p["display-width"] > width and p["display-width"] ~= 2 * width)
glsl-shader="~~/shaders/ravu-zoom-ar-r3-gather.hook" # luma upscaling (fractional) light
profile-restore=copy

[VideoLumaDownscale]
profile-cond=(p["display-width"] < width)
glsl-shader="~~/shaders/SSimDownscaler.glsl" # downscaling
profile-restore=copy

[InterlacedVideo]
profile-cond=(p["video-frame-info/interlaced"] and p["estimated-vf-fps"] < 31)
deinterlace=yes # MPV now uses BWDIF by default
profile-restore=copy

### RX 5700 XT 1080p -> 2160p rough timings for shaders:
## Chroma Upscale
# CfL: 0.2ms
# Krig: 1ms
#
## Luma Upscale
# ravu-lite-ar-r4: 1.5ms
# ravu-zoom-ar-r3: 4ms
# SSimSuperRes: 7ms
# FSRCNNX_x2_8: 9ms
# FSRCNNX_x2_16: 24ms
#
# Luma Downscale 1080p -> ~900p
# SSimDownscaler: 2.3ms

###################################
# Protocol Specific Configuration #
###################################

[protocol.http]
hls-bitrate=max # use max quality for HLS streams
cache=yes
no-cache-pause # don't pause when the cache runs low

[protocol.https]
profile=protocol.http

[protocol.ytdl]
profile=protocol.http
