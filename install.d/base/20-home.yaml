- link:
    ~/.bash_profile: home/.bash_profile
    ~/.bashrc: home/.bashrc
    ~/.claude/CLAUDE.md: home/.claude/CLAUDE.md
    ~/.claude/settings.json: home/.claude/settings.json
    # Per-skill, not the whole ~/.claude/skills directory, so skills installed by other
    # means stay put. The agent-vm guest reaches the same tree through a symlink in
    # profiles/agent-vm (it links ~/.claude/skills wholesale — see vm/provision.sh).
    ~/.claude/skills/README.md: home/.claude/skills/README.md
    ~/.claude/skills/ship-issue: home/.claude/skills/ship-issue
    ~/.claude/skills/investigate: home/.claude/skills/investigate
    ~/.claude/skills/review-change: home/.claude/skills/review-change
    ~/.claude/skills/address-feedback: home/.claude/skills/address-feedback
    ~/.claude/skills/approach: home/.claude/skills/approach
    ~/.claude/skills/explore: home/.claude/skills/explore
    ~/.emacs.d/early-init.el: home/emacs.d/early-init.el
    ~/.emacs.d/init.el: home/emacs.d/init.el
    ~/.emacs.d/straight/versions/default.el: home/emacs.d/straight/versions/default.el
    ~/.gemrc: home/.gemrc
    ~/.gitconfig: home/.gitconfig
    ~/.gitconfig-local: home/.gitconfig-local
    ~/.gitignore: home/.gitignore
    ~/.irbrc: home/.irbrc
    ~/.nethackrc: home/.nethackrc
    ~/.profile: home/.profile
    ~/.rpmmacros: home/.rpmmacros
    ~/.ssh/allowed_signers: home/.ssh/allowed_signers
    ~/.vim: home/vim
    ~/.vimrc: home/.vimrc
    ~/.Xclients: home/.Xclients
    ~/.zprofile: home/.zprofile
    ~/.zsh_plugins.txt: home/.zsh_plugins.txt
    ~/.zsh_plugins_after_compinit.txt: home/.zsh_plugins_after_compinit.txt
    ~/.zshenv: home/.zshenv
    ~/.zshrc: home/.zshrc
