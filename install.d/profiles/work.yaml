- link:
    ~/.claude/settings.json: profiles/work/home/.claude/settings.json
    ~/.gitconfig-local: profiles/work/home/.gitconfig-local
    ~/.config/Code/User/settings.json: profiles/work/xdg_config/Code/User/settings.json
    ~/.config/sway/profile.conf: profiles/work/xdg_config/sway/profile.conf
    ~/.config/kanshi/config: profiles/work/xdg_config/kanshi/config
    ~/.config/switch-mon/config: profiles/work/xdg_config/switch-mon/config

- shell:
    - command: bootstrap/kanshi
      description: Wire kanshi into the sway session for per-desk output layouts
      stdout: true
      stderr: true
