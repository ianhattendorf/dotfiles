# https://knowledgebase.frame.work/en_us/expansion-card-slot-functionality-on-framework-laptop-16-amd-ryzen-7040-series-rkUjGm7cn
# DP-1: graphics module port
# DP-3: port 4 (top right)
# DP-4: port 1 (top left)
# usb4 -> hdmi: 160hz
# usb4 -> usb: 120hz (Graphics Module) 60hz (laptop port)
#
# Geometry (mode, position, scale, adaptive_sync) lives in
# profiles/work/xdg_config/kanshi/config, which matches per desk on the set of
# connected outputs. Only the settings that do not vary by desk are here.
#
# Identifiers are written out literally rather than through `set $var`, because
# sway strips the quotes when expanding a variable and the make/model/serial
# strings contain spaces.

# Laptop panel.
output eDP-2 {
    bg '~/Pictures/wallpaper-1' fill #000000
    subpixel rgb
}

# Home desk, still matched by connector name: these monitors' identifiers are not
# recorded yet. See the note in the kanshi config.
output DP-4 {
    bg '~/Pictures/wallpaper-2' fill #000000
    render_bit_depth 8
    subpixel rgb
}

output DP-1 {
    bg '~/Pictures/wallpaper-portrait' fill #000000
    render_bit_depth 8
    subpixel rgb
}

# Office desk, matched by identifier since these move between ports.
output "LG Electronics LG Ultra HD 0x0005CDAD" {
    bg '~/Pictures/wallpaper-2' fill #000000
    render_bit_depth 8
    subpixel rgb
}

output "LG Electronics LG HDR QHD 102NTDVA2554" {
    bg '~/Pictures/wallpaper-1' fill #000000
    render_bit_depth 8
    subpixel rgb
}

# Sway takes a fallback list and uses the first connected output, so one set of
# assignments covers both desks and the undocked laptop.
workspace 1 output DP-4 "LG Electronics LG Ultra HD 0x0005CDAD" eDP-2
workspace 2 output DP-1 "LG Electronics LG HDR QHD 102NTDVA2554" eDP-2
workspace 3 output DP-4 "LG Electronics LG Ultra HD 0x0005CDAD" eDP-2
workspace 4 output eDP-2
workspace 5 output DP-4 "LG Electronics LG Ultra HD 0x0005CDAD" eDP-2
workspace 6 output DP-4 "LG Electronics LG Ultra HD 0x0005CDAD" eDP-2

# A `swaymsg reload` resets every output to its defaults, and kanshi only reacts
# to output hotplug, not to sway reloads — so nudge it to reapply. At initial
# startup this races sway-systemd's session.sh and may find kanshi not yet
# running; that is harmless, since kanshi applies the matching profile on start.
exec_always kanshictl reload

# Workspace 1 is on the center screen at every desk.
exec swaymsg workspace 1
