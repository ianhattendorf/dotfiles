# https://knowledgebase.frame.work/en_us/expansion-card-slot-functionality-on-framework-laptop-16-amd-ryzen-7040-series-rkUjGm7cn
# DP-1: graphics module port
# DP-3: port 4 (top right)
# DP-4: port 1 (top left)
# usb4 -> hdmi: 160hz
# usb4 -> usb: 120hz (Graphics Module) 60hz (laptop port)

set $output_center DP-4
set $output_left eDP-2
set $output_right DP-1

output $output_left {
    bg '~/Pictures/wallpaper-1' fill #000000
    position 0,607
    adaptive_sync off
    resolution 2560x1600@165Hz
    scale 1.5
    subpixel rgb
}

output $output_center {
    bg '~/Pictures/wallpaper-2' fill #000000
    position 1706,0
    resolution 3840x2160@160Hz
    adaptive_sync off
    render_bit_depth 8
    scale 1.5
    subpixel rgb
}

output $output_right {
    bg '~/Pictures/wallpaper-portrait' fill #000000
    position 4266,0
    resolution 3840x2160@120Hz
    adaptive_sync off
    render_bit_depth 8
    scale 1.5
    subpixel rgb
}

workspace 1 output $output_center
workspace 2 output $output_right
workspace 3 output $output_center
workspace 4 output $output_left
workspace 5 output $output_center
workspace 6 output $output_center

exec swaymsg focus output $output_center
