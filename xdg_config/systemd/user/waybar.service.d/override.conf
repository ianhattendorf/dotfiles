# Drop-in over Fedora's /usr/lib/systemd/user/waybar.service.
#
# waybar 0.15 segfaults when an output is removed: the Bar destructor tears
# down the pulseaudio module, whose AudioBackend calls
# pa_threaded_mainloop_stop() on an already-invalid mainloop. Changing the
# monitor layout therefore kills the bar. Restart it instead of going bare.
#
# The shipped unit is PartOf=graphical-session.target, so session shutdown
# still stops waybar rather than fighting Restart=always.

[Unit]
StartLimitIntervalSec=60
StartLimitBurst=10

[Service]
Restart=always
RestartSec=1
