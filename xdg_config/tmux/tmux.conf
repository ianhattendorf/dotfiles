
# 24-bit color support broken with tmux
# https://codeberg.org/dnkl/foot/issues/492
set -ga terminal-overrides ",foot:Tc"

# Enable extended keys so modifiers (shift, ctrl) are distinguishable.
# Always forward them in CSI-u format so TUIs can recognize keys like Shift+Enter.
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'foot:extkeys'
set -as terminal-features 'alacritty:extkeys'

# Set parent terminal title to reflect current window in tmux session 
set -g set-titles on
set -g set-titles-string "#I: #W"

# Use tmux-yank for clipboard instead of tmux's built-in OSC 52,
# which uses the ST terminator that mosh doesn't support.
set -g set-clipboard off
set -s copy-command 'tmux-yank'

# Enable mouse support
set -g mouse on

# Focus events enabled for terminals that support them
set -g focus-events on

# Start numbering windows from index 1
set -g base-index 1

# Start numbering panes from index 1
setw -g pane-base-index 1

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Activity bell and whistles
#set -g visual-activity on
#set -g visual-bell on or both

set -g pane-border-style "hidden"
set -g pane-active-border-style "fg=default"

set -g status-position top
set -g status-style "fg=default,bg=default,reverse"
set -g status-interval 5

set -g window-status-style "fg=default,bg=default,reverse"
set -g window-status-current-style "fg=default,bg=default"
set -g window-status-format "#I: #W#{?@agent_status, [#{@agent_status}],}#F"
set -g window-status-current-format "[#I: #W#{?@agent_status, [#{@agent_status}],}#F]"

# are we zoomed?
set -g status-left "#(tmux-agent-refresh)[#S]#[fg=default,bg=default,reverse]#{?window_zoomed_flag, ↕ ,}"
set -g status-right "#(tmux-status)"
set -g status-right-length 90

set -g renumber-windows on
set -ag update-environment " DISPLAY WAYLAND_DISPLAY SWAYSOCK SSH_AUTH_SOCK"

bind a run-shell "tmux-agent-next --current #{pane_id}"
bind A run-shell "tmux-agent-next"
bind e run-shell "tmux-agent-prev --current #{pane_id}"
bind E run-shell "tmux-agent-prev"
bind s run-shell "tmux-agent-refresh" \; choose-tree -sZ -O name -F "#{session_windows} win#{?session_attached, (attached),}#{?@agent_status, [#{@agent_status}],}"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

set-option -g detach-on-destroy off

set -g @continuum-restore 'on'

run-shell '~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
run-shell '~/.tmux/plugins/tmux-continuum/continuum.tmux'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-boot 'on'
