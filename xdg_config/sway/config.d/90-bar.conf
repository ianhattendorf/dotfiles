# Overrides /usr/share/sway/config.d/90-bar.conf (same basename wins in
# layered-include), which spawns waybar via `bar { swaybar_command waybar }`.
#
# Sway does not respawn a swaybar_command that dies, and waybar 0.15 segfaults
# on output removal (Client::handleDeferredMonitorRemoval -> ~Bar ->
# ~Pulseaudio -> pa_threaded_mainloop_stop), so unplugging a monitor left the
# bar gone until the next `swaymsg reload`.
#
# Instead waybar runs as waybar.service, wanted by sway-session.target, with a
# Restart=always drop-in in xdg_config/systemd/user/waybar.service.d/.
# Deliberately no `bar` block here.
